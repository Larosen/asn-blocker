name: sources
# Checks all external data sources (RIPEstat, bgp.tools, Spamhaus, VPN providers) live,
# so format or API changes are caught before a production run fails.
on:
  pull_request:
    paths: ["app/sources.py", "app/cli.py", "app/data/**", ".github/workflows/sources.yml"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes --no-deps -r requirements.txt
      - name: Check sources live
        env:
          DATA_DIR: ${{ runner.temp }}/asnb
        run: python -m app.cli check-sources
