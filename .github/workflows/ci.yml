name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  # Integrationstest gegen eine echte CrowdSec-LAPI (aktuelles Release)
  lapi:
    runs-on: ubuntu-latest
    env:
      CROWDSEC_IMAGE: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
      CROWDSEC_LAPI_URL: http://127.0.0.1:8080
      CROWDSEC_MACHINE_ID: asn-blocker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - name: CrowdSec starten
        run: |
          docker run -d --name crowdsec -p 127.0.0.1:8080:8080 -v cs-data:/var/lib/crowdsec/data \
            -e DISABLE_ONLINE_API=true "$CROWDSEC_IMAGE"
          for i in $(seq 1 60); do docker exec crowdsec cscli lapi status >/dev/null 2>&1 && break; sleep 2; done
          docker exec crowdsec cscli version
          echo "CROWDSEC_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Machine anlegen
        run: docker exec crowdsec cscli machines add "$CROWDSEC_MACHINE_ID" --password "$CROWDSEC_PASSWORD" -f /dev/null
      - name: Integrationstest (darf nicht übersprungen werden)
        run: pytest -q -rs tests/test_lapi_integration.py | tee out.txt && grep -q "1 passed" out.txt
      - if: failure()
        run: docker logs crowdsec | tail -50

  image:
    needs: [test, lapi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image-Name (GHCR verlangt Kleinbuchstaben)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      # Trivy direkt als Image (per Digest gepinnt) statt trivy-action
      - name: Trivy-Scan
        if: github.event_name != 'pull_request'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD
          aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
          image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
          "${IMAGE}@${{ steps.build.outputs.digest }}"
      # Attestations gibt es fuer private Repos persoenlicher Accounts nicht; die
      # SLSA-Provenance haengt per buildx (provenance: mode=max) trotzdem am Image.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request' && !github.event.repository.private
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
