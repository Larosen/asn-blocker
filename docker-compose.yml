# Minimal: ein Container, ein Volume. Alles Weitere wird in der Oberfläche eingerichtet.
services:
  asn-blocker:
    image: ghcr.io/larosen/asn-blocker:latest
    container_name: asn-blocker
    restart: unless-stopped
    volumes:
      - asn-blocker-data:/data
    networks:
      - crowdsec      # Netz, in dem der CrowdSec-Container erreichbar ist
      # - pangolin    # bzw. das Netz des Reverse Proxys (Newt/Traefik)
    # Ohne Reverse Proxy stattdessen nur lokal veröffentlichen:
    # ports: ["127.0.0.1:8080:8080"]

    # Empfohlene Härtung (optional):
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  asn-blocker-data:

networks:
  crowdsec:
    external: true
