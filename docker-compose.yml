# Minimal: one container, one volume. Everything else is set up in the UI.
services:
  asn-blocker:
    image: ghcr.io/larosen/asn-blocker:latest
    container_name: asn-blocker
    restart: unless-stopped
    volumes:
      - asn-blocker-data:/data
      # Self-protection: detect the host's active SSH sessions (read-only)
      - /var/run/utmp:/host/utmp:ro
    networks:
      - crowdsec      # network in which the CrowdSec container is reachable
      # - pangolin    # or the reverse proxy's network (Newt/Traefik), see README "Network isolation"
    # Without a reverse proxy, publish locally only instead:
    # ports: ["127.0.0.1:8080:8080"]

    # Hardening – keep these: the app needs none of the dropped privileges
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    cpus: 1

volumes:
  asn-blocker-data:

networks:
  crowdsec:
    external: true
